# Publica en el canal de Telegram de AIAcciones España cada video de cola-es/ (rama youtube-cola)
# cuando ya está subido y público en YouTube: foto (miniatura.png) + post-telegram.txt o, si no hay,
# post-linkedin.txt (el resumen largo, con el enlace del video y de la ficha). Los Shorts no se publican
# (repetirían el video largo), salvo que su carpeta traiga su propio post-telegram.txt.
# Credenciales: Settings > Secrets and variables > Actions > TELEGRAM_BOT_TOKEN_ES (token de @BotFather)
# y TELEGRAM_CHANNEL_ES (@usuario del canal, p. ej. @AIAccionesEspana). El bot tiene que ser administrador del canal.
# Mientras falten los secretos, el workflow no hace nada (sale en verde con un aviso).
# TELEGRAM_DESDE evita publicar de golpe los videos antiguos: el canal arrancó (6-nov-2026) con los 3 últimos
# (Sacyr, Rovi y ArcelorMittal, subidos desde el 3-nov). Cada post lleva el enlace al canal de YouTube.
# El script se toma siempre de main (la rama youtube-cola puede tener una copia vieja).
# Corre al terminar cada subida a YouTube de España y una vez al día de repaso.
# "Run workflow" con modo=verificar solo prueba el bot y el canal; modo=publicar manda lo pendiente.
name: Publicar en Telegram (España)
concurrency: telegram-espana
on:
  workflow_run:
    workflows: ["Subir videos a YouTube (España)"]
    types: [completed]
  schedule:
    - cron: "30 7 * * *"   # repaso diario (9:30 en Madrid en invierno) por si algún video quedó sin publicar
  workflow_dispatch:
    inputs:
      modo:
        description: "verificar (solo el bot y el canal) o publicar (desde la rama youtube-cola)"
        default: verificar
permissions:
  contents: write
jobs:
  telegram:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_ES }}
      TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL_ES || vars.TELEGRAM_CHANNEL_ES }}
      TELEGRAM_TEXTOS: post-telegram.txt,post-linkedin.txt
      TELEGRAM_CANAL_YOUTUBE: https://www.youtube.com/@AIAccionesEspa%C3%B1a
      TELEGRAM_TEXTO_YOUTUBE: "Suscríbete al canal de YouTube:"
      TELEGRAM_DESDE: "2026-11-03"
      PUBLICAR: ${{ github.event_name != 'workflow_dispatch' || inputs.modo == 'publicar' }}
    steps:
      - name: Revisar que los secretos de España estén cargados
        id: secretos
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHANNEL" ]; then
            echo "::notice::Faltan TELEGRAM_BOT_TOKEN_ES o TELEGRAM_CHANNEL_ES: no se publica nada en Telegram."
            echo "listo=no" >> "$GITHUB_OUTPUT"
            [ "${{ github.event_name }}" = "workflow_dispatch" ] && exit 1 || exit 0
          fi
          echo "listo=si" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.secretos.outputs.listo == 'si'
        with:
          ref: ${{ env.PUBLICAR == 'true' && 'youtube-cola' || github.ref }}
          # sin los .mp4 (la cola pesa varios GB): solo el script, los textos, los .json y las miniaturas
          filter: blob:none
          sparse-checkout: |
            /scripts/
            /cola-es/**/*.json
            /cola-es/**/*.txt
            /cola-es/**/miniatura.png
          sparse-checkout-cone-mode: false
      - name: Verificar bot y canal
        if: steps.secretos.outputs.listo == 'si' && env.PUBLICAR != 'true'
        run: git fetch -q --depth=1 origin main && git show origin/main:scripts/telegram.py > "$RUNNER_TEMP/telegram.py" && python3 "$RUNNER_TEMP/telegram.py" verificar
      - name: Publicar pendientes
        if: steps.secretos.outputs.listo == 'si' && env.PUBLICAR == 'true'
        run: git fetch -q --depth=1 origin main && git show origin/main:scripts/telegram.py > "$RUNNER_TEMP/telegram.py" && python3 "$RUNNER_TEMP/telegram.py" publicar cola-es
      - name: Guardar lo publicado
        if: always() && steps.secretos.outputs.listo == 'si' && env.PUBLICAR == 'true'
        run: |
          git config user.name "aiacciones-bot"
          git config user.email "aiacciones-bot@users.noreply.github.com"
          git add cola-es
          git diff --cached --quiet && exit 0
          git commit -m "Telegram España $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q origin youtube-cola && git push origin HEAD:youtube-cola && exit 0; sleep $((5*i)); done
          exit 1
