# Voz neuronal de Azure (ar-SA-HamedNeural) para el vídeo diario largo de Nabd Wall Street (nabd/diario/voz_azure.py).
# Se lanza sola cuando la sesión diaria sube nabd/diario/<fecha>/video.json a una rama claude/nabd-diario-*, o a mano con "Run workflow".
# Deja un wav por frase en <fecha>/ de la rama voz-nabd (se reescribe cada día, sin historial, para no engordar el repo);
# make_video.py los usa con VOZ_DIR. Sin los secretos no hace nada y el vídeo sale con la voz Piper.
# Secretos: AZURE_SPEECH_KEY_NABD (Clave 1 del recurso de voz de Azure) y AZURE_SPEECH_REGION_NABD (p. ej. northeurope).
# modo=verificar solo prueba la clave con una frase.
# Martes y jueves (o avatar=si) añade el presentador IA de HeyGen en la apertura del diario: avatar.mp4 + avatar.json (avatar_heygen.py,
# secreto HEYGEN_API_KEY). Es opcional: si falla, la voz se publica igual y el vídeo sale sin presentador.
name: Voz Azure del video diario (Nabd)
on:
  push:
    branches: ["claude/nabd-diario-**"]
    paths: ["nabd/diario/*/video.json"]
  workflow_dispatch:
    inputs:
      modo:
        description: "generar (la voz de un día) o verificar (solo la clave)"
        default: verificar
      fecha:
        description: "fecha de la sesión (AAAA-MM-DD) o carpeta con video.json (p. ej. nabd/serie20/intro) para modo=generar; vacío = la carpeta más reciente"
        default: ""
      avatar:
        description: "presentador HeyGen en la apertura del diario: auto (martes y jueves), si (cualquier día) o no"
        default: auto
permissions:
  contents: write
concurrency: voz-nabd
jobs:
  voz:
    runs-on: ubuntu-latest
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY_NABD }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION_NABD || 'northeurope' }}
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar la clave
        id: clave
        run: |
          if [ -z "$AZURE_SPEECH_KEY" ]; then echo "Falta el secreto AZURE_SPEECH_KEY_NABD: el vídeo saldrá con la voz Piper."; echo "ok=0" >> $GITHUB_OUTPUT; exit 0; fi
          echo '{"voz":{"x":"مرحبا بكم في نبض وول ستريت."}}' > /tmp/prueba.json
          python3 nabd/diario/voz_azure.py /tmp/prueba.json /tmp/prueba && ls -la /tmp/prueba && echo "ok=1" >> $GITHUB_OUTPUT
      - name: Generar la voz del día
        if: steps.clave.outputs.ok == '1' && (github.event_name == 'push' || inputs.modo == 'generar')
        run: |
          F="${{ inputs.fecha }}"
          if [ -z "$F" ]; then F=$(ls -d nabd/diario/20??-??-?? | sort | tail -1 | xargs basename); fi
          echo "fecha $F"
          # fecha también puede ser una o varias carpetas del repo con video.json, separadas por comas
          # (p. ej. nabd/serie20/intro o los episodios del día de la serie 20 acciones); cada una sale en <rama voz-nabd>/<nombre de la carpeta>
          for X in ${F//,/ }; do
            D=nabd/diario/$X; [ -f "$X/video.json" ] && D=$X
            python3 nabd/diario/voz_azure.py $D/video.json /tmp/voz/$(basename "$X")
            # Presentador IA (HeyGen) en la apertura del diario, martes y jueves (prueba de un mes, 14-nov-2026). Opcional: nunca para la voz.
            if [[ "$X" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] && [ "${{ inputs.avatar }}" != "no" ] && [ -n "$HEYGEN_API_KEY" ]; then
              pip install -q numpy matplotlib pillow arabic-reshaper python-bidi || true
              [ "${{ inputs.avatar }}" = "si" ] && export AVATAR_DIAS=0,1,2,3,4,5,6
              timeout 1800 python3 nabd/diario/avatar_heygen.py $D/video.json /tmp/voz/$X $X || true
            fi
          done
          cd /tmp/voz && git init -q -b voz-nabd && git add .
          git -c user.name="aiacciones-bot" -c user.email="aiacciones-bot@users.noreply.github.com" commit -qm "Voz Azure del video diario Nabd $F"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for i in 1 2 3; do git push -qf origin voz-nabd && break; sleep 5; done
