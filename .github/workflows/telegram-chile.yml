# Publica en el canal de Telegram de AIAcciones Chile cada video de cola/ (rama youtube-cola)
# cuando ya está subido y público en YouTube: foto (miniatura.png) + post-telegram.txt, o si no post-linkedin.txt,
# con {youtube} cambiado por el enlace del video. Siempre lleva enlace a aiacciones.cl y al canal de YouTube.
# Credenciales: Settings > Secrets and variables > Actions > TELEGRAM_BOT_TOKEN_CL (token de @BotFather)
# y TELEGRAM_CHANNEL_CL (@usuario del canal; si falta, @aiaccioneschile). El bot tiene que ser administrador del canal.
# Solo publica videos subidos desde TELEGRAM_DESDE (para no mandar todo lo atrasado de una vez).
# "Run workflow" con modo=verificar solo prueba el bot y el canal; modo=publicar manda lo pendiente.
name: Publicar en Telegram (Chile)
concurrency: telegram-chile
on:
  workflow_run:
    workflows: ["Subir videos a YouTube"]
    types: [completed]
  push:
    branches: [youtube-cola]
    paths: ['cola/**/post-telegram.txt', 'cola/**/post-linkedin.txt']
  workflow_dispatch:
    inputs:
      modo:
        description: "verificar (solo el bot y el canal) o publicar (desde la rama youtube-cola)"
        default: verificar
      ultimos:
        description: "con modo=publicar: publicar solo los N videos más recientes aún no publicados (aunque sean anteriores a TELEGRAM_DESDE)"
        default: ""
permissions:
  contents: write
jobs:
  telegram:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_CL }}
      TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL_CL || vars.TELEGRAM_CHANNEL_CL || '@aiaccioneschile' }}
      TELEGRAM_TEXTOS: post-telegram.txt,post-linkedin.txt
      TELEGRAM_CANAL_YOUTUBE: https://www.youtube.com/@aiaccioneschile
      TELEGRAM_TEXTO_YOUTUBE: "Suscríbete al canal:"
      TELEGRAM_WEB: https://aiacciones.cl
      TELEGRAM_DESDE: ${{ vars.TELEGRAM_DESDE_CL || '2026-11-06' }}
      TELEGRAM_ULTIMOS: ${{ github.event_name == 'workflow_dispatch' && inputs.ultimos || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name != 'workflow_dispatch' || inputs.modo == 'publicar') && 'youtube-cola' || github.ref }}
      - name: Verificar bot y canal
        if: github.event_name == 'workflow_dispatch' && inputs.modo != 'publicar'
        run: python3 scripts/telegram.py verificar
      - name: Publicar pendientes
        if: (github.event_name != 'workflow_dispatch' || inputs.modo == 'publicar') && env.TELEGRAM_BOT_TOKEN != ''
        run: git fetch -q --depth=1 origin main && git show origin/main:scripts/telegram.py > "$RUNNER_TEMP/telegram.py" && python3 "$RUNNER_TEMP/telegram.py" publicar cola
      - name: Guardar lo publicado
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.modo == 'publicar')
        run: |
          git config user.name "aiacciones-bot"
          git config user.email "aiacciones-bot@users.noreply.github.com"
          git add cola
          git diff --cached --quiet && exit 0
          git commit -m "Telegram Chile $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
