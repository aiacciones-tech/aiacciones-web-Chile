# Sube al canal Wall Street auf Deutsch (bolsa de EE. UU. en alemán para Alemania, Austria y Suiza) los videos y Shorts que la rutina diaria deja en cola-ge/ de la rama youtube-cola.
# Mismo script que Chile y España (scripts/youtube.py), con otra carpeta y otro token.
# Credenciales: Settings > Secrets and variables > Actions. YT_REFRESH_TOKEN_GE es obligatorio;
# YT_CLIENT_ID_GE / YT_CLIENT_SECRET_GE solo si se creó un cliente OAuth aparte (si no, usa los de Nabd).
# "Run workflow" con modo=verificar solo prueba las credenciales y muestra el canal.
name: Subir videos a YouTube (Wall Street auf Deutsch)
concurrency: youtube-ge
on:
  push:
    branches: [youtube-cola]
    paths: ['cola-ge/**/meta.json']
  workflow_dispatch:
    inputs:
      modo:
        description: "verificar (solo credenciales), subir (desde la rama youtube-cola) o miniaturas (reintenta las miniaturas que dieron error)"
        default: verificar
      filtro:
        description: "solo con modo=miniaturas: texto que debe contener la carpeta (p. ej. 2026-11-12); vacío = todas"
        default: ""
permissions:
  contents: write
jobs:
  subir:
    runs-on: ubuntu-latest
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID_GE || secrets.YT_NABD_CLIENT_ID || secrets.YT_CLIENT_ID }}   # reutiliza el cliente OAuth de Nabd
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET_GE || secrets.YT_NABD_CLIENT_SECRET || secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN_GE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'push' || inputs.modo == 'subir' || inputs.modo == 'miniaturas') && 'youtube-cola' || github.ref }}
      - name: Revisar que el token de GE esté cargado
        run: test -n "$YT_REFRESH_TOKEN" || { echo "Falta el secreto YT_REFRESH_TOKEN_GE"; exit 1; }
      - name: Verificar credenciales
        if: github.event_name == 'workflow_dispatch' && inputs.modo == 'verificar'
        run: python3 scripts/youtube.py verificar
      - name: Subir videos pendientes
        if: github.event_name == 'push' || inputs.modo == 'subir'
        run: python3 scripts/youtube.py subir cola-ge
      - name: Reintentar miniaturas (las que fallaron con 403 antes de verificar el canal por teléfono)
        if: inputs.modo == 'miniaturas'
        # La rama youtube-cola puede tener una copia antigua del script: se usa la de main.
        run: |
          git fetch -q --depth 1 origin main && git show origin/main:scripts/youtube.py > "$RUNNER_TEMP/youtube.py"
          python3 "$RUNNER_TEMP/youtube.py" miniaturas cola-ge "${{ inputs.filtro }}"
      - name: Guardar IDs de YouTube
        if: github.event_name == 'push' || inputs.modo == 'subir' || inputs.modo == 'miniaturas'
        run: |
          git config user.name "aiacciones-bot"
          git config user.email "aiacciones-bot@users.noreply.github.com"
          git add cola-ge
          git diff --cached --quiet || { git commit -m "IDs de YouTube GE $(date -u +%F)" && for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done; exit 1; }
