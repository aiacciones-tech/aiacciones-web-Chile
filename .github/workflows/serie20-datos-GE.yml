# Datos de las empresas extra de «Die Wall-Street-Giganten» (Wall Street auf Deutsch): Anthropic (ANT) y SpaceX (SPCX), Daniel 21-nov-2026.
# Las 20 grandes siguen saliendo de la rama datos-serie20-nabd (de Nabd, solo lectura). Este workflow usa ge/serie20/datos_extra.py
# (que reutiliza nabd/serie20/datos_tv.py sin tocarlo) y guarda calendario.json y <TICKER>/datos.json en la rama datos-serie20-ge.
# Corre a las 11:10 y 23:40 UTC, como el de Nabd, o a mano.
name: Datos de la serie Wall-Street-Giganten, empresas extra (Wall Street auf Deutsch)
on:
  schedule:
    - cron: "10 11 * * *"
    - cron: "40 23 * * *"
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["ge/serie20/datos_extra.py", ".github/workflows/serie20-datos-GE.yml"]
permissions:
  contents: write
concurrency: datos-serie20-ge
jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar de TradingView
        run: mkdir -p /tmp/datos && python3 ge/serie20/datos_extra.py /tmp/datos
      - name: Guardar en la rama datos-serie20-ge
        run: |
          # sin historial: la rama es siempre la foto más reciente
          cd /tmp/datos && git init -q -b datos-serie20-ge && git add -A
          git -c user.name="aiacciones-bot" -c user.email="aiacciones-bot@users.noreply.github.com" commit -qm "Datos serie 20 GE (extra) $(date -u +%F' '%H:%M)"
          for i in 1 2 3; do git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:datos-serie20-ge && break; sleep 5; done
