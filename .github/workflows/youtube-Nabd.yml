# Sube al canal Nabd Wall Street (نبض وول ستريت, bolsa de EE. UU. en árabe para el Golfo) los videos y Shorts que la rutina de Nabd deja en cola-nabd/ de la rama youtube-cola.
# Mismo script que Chile y España (scripts/youtube.py), con otra carpeta y otro token.
# Credenciales: Settings > Secrets and variables > Actions. YT_NABD_REFRESH_TOKEN es obligatorio;
# YT_NABD_CLIENT_ID / YT_NABD_CLIENT_SECRET solo si se creó un cliente OAuth aparte (si no, usa los de Chile).
# "Run workflow" con modo=verificar solo prueba las credenciales y muestra el canal.
name: Subir videos a YouTube (Nabd)
concurrency: youtube-nabd
on:
  push:
    branches: [youtube-cola]
    paths: ['cola-nabd/**/meta.json']
  workflow_dispatch:
    inputs:
      modo:
        description: "verificar (solo credenciales), subir (desde la rama youtube-cola) o miniaturas (reintenta las miniaturas que fallaron)"
        default: verificar
permissions:
  contents: write
jobs:
  subir:
    runs-on: ubuntu-latest
    env:
      YT_CLIENT_ID: ${{ secrets.YT_NABD_CLIENT_ID || secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_NABD_CLIENT_SECRET || secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_NABD_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'push' || inputs.modo == 'subir' || inputs.modo == 'miniaturas') && 'youtube-cola' || github.ref }}
      - name: Revisar que el token de Nabd esté cargado
        run: test -n "$YT_REFRESH_TOKEN" || { echo "Falta el secreto YT_NABD_REFRESH_TOKEN"; exit 1; }
      - name: Verificar credenciales
        if: github.event_name == 'workflow_dispatch' && inputs.modo != 'subir' && inputs.modo != 'miniaturas'
        run: python3 scripts/youtube.py verificar
      - name: Subir videos pendientes
        if: github.event_name == 'push' || inputs.modo == 'subir'
        run: python3 scripts/youtube.py subir cola-nabd
      - name: Reintentar miniaturas que fallaron (p. ej. antes de verificar el canal)
        if: github.event_name == 'workflow_dispatch' && inputs.modo == 'miniaturas'
        run: |
          python3 - <<'PY'
          import glob, json, os, sys, urllib.error, urllib.request
          sys.path.insert(0, "scripts"); import youtube
          t = youtube.token()
          for r in sorted(glob.glob("cola-nabd/*/resultado.json")):
              d = json.load(open(r, encoding="utf-8")); mini = os.path.join(os.path.dirname(r), "miniatura.png")
              if d.get("miniatura") == "si" or not os.path.exists(mini): continue
              req = urllib.request.Request(f"{youtube.API}/upload/youtube/v3/thumbnails/set?videoId={d['videoId']}", open(mini, "rb").read(),
                                           {"Authorization": f"Bearer {t}", "Content-Type": "image/png"})
              try:
                  urllib.request.urlopen(req, timeout=120); d["miniatura"] = "si"
              except urllib.error.HTTPError as e:
                  d["miniatura"] = f"error {e.code}: {e.read().decode('utf-8', 'replace')[:300]}"
              json.dump(d, open(r, "w", encoding="utf-8"), ensure_ascii=False, indent=1)
              print(r, d["videoId"], d["miniatura"][:80])
          PY
      - name: Guardar IDs de YouTube
        if: github.event_name == 'push' || inputs.modo == 'subir' || inputs.modo == 'miniaturas'
        run: |
          git config user.name "aiacciones-bot"
          git config user.email "aiacciones-bot@users.noreply.github.com"
          git add cola-nabd
          git diff --cached --quiet || { git commit -m "IDs de YouTube Nabd $(date -u +%F)" && for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done; exit 1; }
