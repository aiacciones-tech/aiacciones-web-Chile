name: Sonda CNMV (temporal)
on:
  push:
    branches: [hechos-es]
    paths: ['.github/workflows/sonda-cnmv.yml']
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          curl -sSL -A "$UA" -o out/oir.html https://www.cnmv.es/portal/Otra-Informacion-Relevante/AlDia-OIR.aspx -w '%{http_code}\n'
          curl -sSL -A "$UA" -o out/ip.html https://www.cnmv.es/portal/Informacion-Privilegiada/AlDia-IP.aspx -w '%{http_code}\n'
          curl -sSL -A "$UA" -o out/rss.html "https://www.cnmv.es/portal/gpage.aspx?id=RSS" -w '%{http_code}\n'
          ls -la out
      - uses: actions/checkout@v4
        with: {path: repo}
      - run: |
          mkdir -p repo/sonda && cp out/* repo/sonda/ && cd repo
          git config user.name aiacciones-bot && git config user.email aiacciones-bot@users.noreply.github.com
          git add sonda && git commit -m "sonda: HTML de la CNMV" && git push
