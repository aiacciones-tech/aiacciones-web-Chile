# Publica la web en aiacciones.cl por FTPS cada vez que cambia la rama main.
# Credenciales: Settings > Secrets and variables > Actions (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD).
# Usa lftp porque el hosting corta el canal de datos TLS con el cliente de FTP-Deploy-Action (ECONNRESET).
name: Publicar aiacciones.cl
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Subir por FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 30
          mirror --reverse --verbose --parallel=4 web/ public_html/
          bye
          LFTP
