# Publica la web en aiacciones.cl por FTP cada vez que cambia la rama main.
# Credenciales: Settings > Secrets and variables > Actions (FTP_SERVER, FTP_USERNAME, FTP_PASSWORD).
name: Publicar aiacciones.cl
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Subir por FTP (solo archivos cambiados)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./web/
          server-dir: ./public_html/
