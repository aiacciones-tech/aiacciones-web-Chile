# PRUEBA (no toca el flujo de publicación): anima la imagen del presentador IA con SadTalker (gratis, código abierto)
# en la CPU del runner de GitHub y mide el tiempo de render. Lee nabd/avatar/render.txt (línea 1: PNG de la rama avatar-nabd;
# línea 2: wav del repo). Deja los mp4 y el log en la rama avatar-nabd-render. Solo se lanza con push a la rama de la prueba.
name: Prueba avatar render (Nabd)
on:
  push:
    branches: ["claude/project-thread-9tfxe4"]
    paths: ["nabd/avatar/render.txt"]
permissions:
  contents: write
concurrency: avatar-nabd-render
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: SadTalker y pesos (GitHub releases)
        run: |
          T0=$(date +%s)
          git clone -q --depth 1 https://github.com/OpenTalker/SadTalker.git /tmp/st
          cd /tmp/st && mkdir -p checkpoints gfpgan/weights
          R=https://github.com/OpenTalker/SadTalker/releases/download/v0.0.2-rc
          for f in mapping_00109-model.pth.tar mapping_00229-model.pth.tar SadTalker_V0.0.2_256.safetensors; do curl -sSL -o checkpoints/$f $R/$f; done
          curl -sSL -o gfpgan/weights/alignment_WFLW_4HG.pth https://github.com/xinntao/facexlib/releases/download/v0.1.0/alignment_WFLW_4HG.pth
          curl -sSL -o gfpgan/weights/detection_Resnet50_Final.pth https://github.com/xinntao/facexlib/releases/download/v0.1.0/detection_Resnet50_Final.pth
          curl -sSL -o gfpgan/weights/GFPGANv1.4.pth https://github.com/TencentARC/GFPGAN/releases/download/v1.3.0/GFPGANv1.4.pth
          curl -sSL -o gfpgan/weights/parsing_parsenet.pth https://github.com/xinntao/facexlib/releases/download/v0.2.2/parsing_parsenet.pth
          pip install -q torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "numpy==1.23.4" face_alignment==1.3.5 imageio==2.19.3 imageio-ffmpeg==0.4.7 librosa==0.9.2 numba resampy==0.3.1 pydub==0.25.1 scipy==1.10.1 kornia==0.6.8 tqdm yacs==0.1.8 pyyaml joblib==1.1.0 scikit-image==0.19.3 basicsr==1.4.2 facexlib==0.3.0 gfpgan av safetensors "opencv-python==4.8.1.78"
          sed -i 's/from torchvision.transforms.functional_tensor import/from torchvision.transforms.functional import/' $(python -c "import basicsr,os;print(os.path.dirname(basicsr.__file__))")/data/degradations.py || true
          echo "instalacion: $(( $(date +%s)-T0 )) s" | tee -a /tmp/tiempos.txt
      - name: Render
        run: |
          IMG=$(sed -n 1p nabd/avatar/render.txt); WAV=$(sed -n 2p nabd/avatar/render.txt)
          git fetch -q origin avatar-nabd && git show origin/avatar-nabd:"$IMG" > /tmp/presentador.png
          mkdir -p /tmp/out && cp /tmp/presentador.png /tmp/out/ && cp "$WAV" /tmp/out/voz.wav
          echo "cpus: $(nproc)  audio: $(ffprobe -v error -show_entries format=duration -of csv=p=0 $WAV) s" | tee -a /tmp/tiempos.txt
          cd /tmp/st
          T=$(date +%s)
          python inference.py --driven_audio "$GITHUB_WORKSPACE/$WAV" --source_image /tmp/presentador.png --result_dir /tmp/r1 --still --preprocess full --cpu 2>&1 | grep -v -i warn | tail -20
          echo "sadtalker sin mejora: $(( $(date +%s)-T )) s" | tee -a /tmp/tiempos.txt
          cp $(ls /tmp/r1/*.mp4 | head -1) /tmp/out/avatar-sin-mejora.mp4
          T=$(date +%s)
          python inference.py --driven_audio "$GITHUB_WORKSPACE/$WAV" --source_image /tmp/presentador.png --result_dir /tmp/r2 --still --preprocess full --enhancer gfpgan --cpu 2>&1 | grep -v -i warn | tail -20
          echo "sadtalker con gfpgan: $(( $(date +%s)-T )) s" | tee -a /tmp/tiempos.txt
          cp $(ls /tmp/r2/*.mp4 | head -1) /tmp/out/avatar-gfpgan.mp4 || true
      - name: Subir a la rama avatar-nabd-render
        if: always()
        run: |
          mkdir -p /tmp/out && cp /tmp/tiempos.txt /tmp/out/ || true
          cd /tmp/out && git init -q -b avatar-nabd-render && git add .
          git -c user.name="aiacciones-bot" -c user.email="aiacciones-bot@users.noreply.github.com" commit -qm "Render de prueba del avatar (SadTalker CPU)"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for i in 1 2 3; do git push -qf origin avatar-nabd-render && break; sleep 5; done
