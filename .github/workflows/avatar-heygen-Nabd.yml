# PRUEBA (no toca el flujo de publicación): anima la foto del presentador IA de Nabd con la API de HeyGen (Avatar IV)
# usando nuestro audio árabe (voz Azure del 12-nov, 31 s). Mide tiempo de generación y saldo antes/después.
# Deja el mp4 y el informe en la rama avatar-nabd-heygen. Secreto: HEYGEN_API_KEY. Solo se lanza con push a la rama de la prueba.
name: Prueba avatar HeyGen (Nabd)
on:
  push:
    branches: ["claude/project-thread-9tfxe4"]
    paths: ["nabd/avatar/heygen.txt"]
permissions:
  contents: write
concurrency: avatar-nabd-heygen
jobs:
  heygen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      API: https://api.heygen.com
    steps:
      - uses: actions/checkout@v4
      - name: Generar
        run: |
          mkdir -p /tmp/out; R=/tmp/out/informe.txt
          if [ -z "$HEYGEN_API_KEY" ]; then echo "Falta el secreto HEYGEN_API_KEY" | tee $R; exit 0; fi
          IMG=$(sed -n 1p nabd/avatar/heygen.txt); WAV=$(sed -n 2p nabd/avatar/heygen.txt)
          git fetch -q origin avatar-nabd && git show origin/avatar-nabd:"$IMG" > /tmp/presentador.png
          H=(-H "X-Api-Key: $HEYGEN_API_KEY")
          saldo() { curl -sS "$API/v3/users/me" "${H[@]}" | jq -c '{billing_type: .data.billing_type, wallet: .data.wallet, subscription: .data.subscription, usage_based: .data.usage_based}'; }
          echo "saldo antes: $(saldo)" | tee -a $R
          IMG_R=$(curl -sS -X POST "$API/v3/assets" "${H[@]}" -F "file=@/tmp/presentador.png"); echo "subida imagen: $(echo "$IMG_R" | jq -c '{error, asset_id: .data.asset_id}')" | tee -a $R
          AUD_R=$(curl -sS -X POST "$API/v3/assets" "${H[@]}" -F "file=@$WAV"); echo "subida audio: $(echo "$AUD_R" | jq -c '{error, asset_id: .data.asset_id}')" | tee -a $R
          IMG_ID=$(echo "$IMG_R" | jq -r '.data.asset_id'); AUD_ID=$(echo "$AUD_R" | jq -r '.data.asset_id')
          [ "$IMG_ID" != null ] && [ "$AUD_ID" != null ] || exit 1
          T0=$(date +%s)
          BODY=$(jq -n --arg img "$IMG_ID" --arg aud "$AUD_ID" '{type:"image", image:{type:"asset_id", asset_id:$img}, audio_asset_id:$aud, aspect_ratio:"auto", resolution:"1080p", expressiveness:"medium", title:"Nabd prueba avatar"}')
          C=$(curl -sS -X POST "$API/v3/videos" "${H[@]}" -H "Content-Type: application/json" -H "Idempotency-Key: $(uuidgen)" -d "$BODY")
          echo "crear: $(echo "$C" | jq -c .)" | tee -a $R
          VID=$(echo "$C" | jq -r '.data.video_id'); [ "$VID" != null ] || exit 1
          while :; do
            sleep 15
            S=$(curl -sS "$API/v3/videos/$VID" "${H[@]}"); ST=$(echo "$S" | jq -r '.data.status')
            echo "$(( $(date +%s)-T0 )) s: $ST"
            if [ "$ST" = completed ]; then curl -sSL -o /tmp/out/heygen.mp4 "$(echo "$S" | jq -r '.data.video_url')"; break; fi
            if [ "$ST" = failed ]; then echo "fallo: $(echo "$S" | jq -c '.data | {failure_code, failure_message}')" | tee -a $R; break; fi
            [ $(( $(date +%s)-T0 )) -gt 3000 ] && { echo "sin terminar tras 50 min" | tee -a $R; break; }
          done
          echo "tiempo de generacion HeyGen: $(( $(date +%s)-T0 )) s (audio 31.5 s)" | tee -a $R
          echo "duracion devuelta: $(echo "$S" | jq -r '.data.duration')" | tee -a $R
          echo "saldo despues: $(saldo)" | tee -a $R
      - name: Subir a la rama avatar-nabd-heygen
        if: always()
        run: |
          mkdir -p /tmp/out && cd /tmp/out && git init -q -b avatar-nabd-heygen && git add .
          git -c user.name="aiacciones-bot" -c user.email="aiacciones-bot@users.noreply.github.com" commit -qm "Prueba avatar HeyGen" || exit 0
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for i in 1 2 3; do git push -qf origin avatar-nabd-heygen && break; sleep 5; done
