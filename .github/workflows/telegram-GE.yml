# Publica en el canal de Telegram de Wall Street auf Deutsch cada video diario de cola-ge/ (rama youtube-cola)
# cuando ya está subido a YouTube: foto (miniatura.png) + post-telegram.txt con el enlace del video.
# Credenciales: Settings > Secrets and variables > Actions > TELEGRAM_BOT_TOKEN_GE (token de @BotFather)
# y TELEGRAM_CHANNEL_GE (@usuario del canal). El bot tiene que ser administrador del canal.
# Solo post-telegram.txt (lo pone encolar.sh en el video largo; el Short no se publica). Sin los secretos no hace nada.
# "Run workflow" con modo=verificar solo prueba el bot y el canal; modo=publicar manda lo pendiente;
# modo=bienvenida publica y fija el mensaje de bienvenida (ge/telegram/), una sola vez al estrenar el canal.
name: Publicar en Telegram (Wall Street auf Deutsch)
concurrency: telegram-ge
on:
  workflow_run:
    workflows: ["Subir videos a YouTube (Wall Street auf Deutsch)"]
    types: [completed]
  push:
    branches: [youtube-cola]
    paths: ['cola-ge/**/post-telegram.txt']
  workflow_dispatch:
    inputs:
      modo:
        description: "verificar (solo el bot y el canal), publicar (desde la rama youtube-cola) o bienvenida (mensaje fijado)"
        default: verificar
permissions:
  contents: write
jobs:
  telegram:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_GE }}
      TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL_GE || vars.TELEGRAM_CHANNEL_GE }}
      TELEGRAM_SOLO_POST_TELEGRAM: "1"
      TELEGRAM_TEXTO_YOUTUBE: "Kanal abonnieren:"
      TELEGRAM_CANAL_YOUTUBE: https://www.youtube.com/channel/PENDIENTE
    steps:
      - name: Comprobar secretos
        id: s
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHANNEL" ]; then
            echo "Faltan TELEGRAM_BOT_TOKEN_GE o TELEGRAM_CHANNEL_GE: no se publica nada."; echo "ok=no" >> $GITHUB_OUTPUT
            [ "${{ github.event_name }}" != workflow_dispatch ] || exit 1
          else echo "ok=si" >> $GITHUB_OUTPUT; fi
      - uses: actions/checkout@v4
        if: steps.s.outputs.ok == 'si'
        with:
          ref: ${{ (github.event_name != 'workflow_dispatch' || inputs.modo == 'publicar') && 'youtube-cola' || github.ref }}
      - name: Verificar bot y canal
        if: steps.s.outputs.ok == 'si' && github.event_name == 'workflow_dispatch' && inputs.modo != 'publicar'
        run: python3 scripts/telegram.py verificar
      - name: Bienvenida
        if: steps.s.outputs.ok == 'si' && github.event_name == 'workflow_dispatch' && inputs.modo == 'bienvenida'
        run: python3 ge/telegram/bienvenida.py
      - name: Publicar pendientes
        if: steps.s.outputs.ok == 'si' && (github.event_name != 'workflow_dispatch' || inputs.modo == 'publicar')
        run: python3 scripts/telegram.py publicar cola-ge
      - name: Guardar lo publicado
        if: always() && steps.s.outputs.ok == 'si' && (github.event_name != 'workflow_dispatch' || inputs.modo == 'publicar')
        run: |
          git config user.name "aiacciones-bot"
          git config user.email "aiacciones-bot@users.noreply.github.com"
          git add cola-ge
          git diff --cached --quiet && exit 0
          git commit -m "Telegram GE $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
