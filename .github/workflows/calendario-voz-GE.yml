# Voz neuronal de Azure en alemán (de-DE-ConradNeural) del Short semanal «Wochenkalender der Quartalszahlen» (ge/calendario/).
# Se lanza sola al subir ge/calendario/semanas/<fecha>/calendario.json a una rama claude/ge-calendario-*, o a mano con "Run workflow".
# Deja un wav por frase en <fecha>/ de la rama voz-ge-calendario (se reescribe en cada ejecución, sin historial; aparte de voz-ge del diario).
# make_calendario.py los usa con VOZ_DIR. Mismo recurso de Azure que el diario: AZURE_SPEECH_KEY_GE y AZURE_SPEECH_REGION_GE.
name: Voz Azure del calendario semanal (Wall Street auf Deutsch)
on:
  push:
    branches: ["claude/ge-calendario-**"]
    paths: ["ge/calendario/semanas/*/calendario.json"]
  workflow_dispatch:
    inputs:
      fecha:
        description: "carpeta de ge/calendario/semanas (AAAA-MM-DD); vacío = la más reciente"
        default: ""
permissions:
  contents: write
concurrency: voz-ge-calendario
jobs:
  voz:
    runs-on: ubuntu-latest
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY_GE }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION_GE || 'germanywestcentral' }}
    steps:
      - uses: actions/checkout@v4
      - name: Generar la voz
        run: |
          if [ -z "$AZURE_SPEECH_KEY" ]; then echo "Falta AZURE_SPEECH_KEY_GE: el Short saldrá con Piper."; exit 0; fi
          F="${{ inputs.fecha }}"
          if [ -z "$F" ]; then F=$(ls -d ge/calendario/semanas/20??-??-?? | sort | tail -1 | xargs basename); fi
          echo "semana $F"
          python3 ge/diario/voz_azure.py ge/calendario/semanas/$F/calendario.json /tmp/voz/$F
          cd /tmp/voz && git init -q -b voz-ge-calendario && git add .
          git -c user.name="aiacciones-bot" -c user.email="aiacciones-bot@users.noreply.github.com" commit -qm "Voz Azure del calendario GE $F"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for i in 1 2 3; do git push -qf origin voz-ge-calendario && break; sleep 5; done
