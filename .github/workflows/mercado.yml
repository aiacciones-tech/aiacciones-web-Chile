# Cada día hábil después del cierre de la Bolsa de Santiago: precios de cierre, índices,
# P/E del mercado y hechos esenciales (CMF). Escribe los datos en web/ y publica en aiacciones.cl.
name: Actualizar precios
on:
  schedule:
    - cron: "40 21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency: publicar
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar datos de mercado y hechos esenciales
        run: python3 scripts/mercado.py fetch
      - name: Escribir los datos en las páginas
        run: python3 scripts/hornear.py web
      - name: Guardar cambios
        id: git
        run: |
          git config user.name "aiacciones-bot"
          git config user.email "aiacciones-bot@users.noreply.github.com"
          git add web
          if git diff --cached --quiet; then echo "cambios=no" >> "$GITHUB_OUTPUT"; else
            git commit -m "Precios de cierre y hechos esenciales $(date -u +%F)" && git push && echo "cambios=si" >> "$GITHUB_OUTPUT"; fi
      - name: Instalar lftp
        if: steps.git.outputs.cambios == 'si'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Publicar por FTPS
        if: steps.git.outputs.cambios == 'si'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<'LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 30
          mirror --reverse --only-newer --parallel=4 web/ public_html/
          bye
          LFTP
